<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <clipPath id="pd-eye-clip-l"><ellipse cx="80" cy="103" rx="9" ry="7.6"/></clipPath>
    <clipPath id="pd-eye-clip-r"><ellipse cx="120" cy="103" rx="9" ry="7.6"/></clipPath>
    <symbol id="prof-svg" viewBox="0 0 200 200">
      <g class="bubbles" fill="#9fb7cc"><circle cx="160" cy="48" r="5"/><circle cx="172" cy="32" r="7"/><circle cx="186" cy="14" r="9"/></g>
      <g class="ear-wave" fill="none" stroke="#e76f24" stroke-width="4" stroke-linecap="round"><path d="M28 92 q-10 14 0 28"/><path d="M18 84 q-16 22 0 44"/></g>
      <rect x="62" y="150" width="76" height="40" rx="16" fill="#1d5c8f"/>
      <path d="M86 158 l14 8 l14 -8 l0 16 l-14 -8 l-14 8z" fill="#c2410c"/>
      <circle cx="100" cy="105" r="52" fill="#f2c9a0"/>
      <path d="M52 92 q4 -40 48 -44 q44 4 48 44 q-10 -22 -48 -24 q-38 2 -48 24z" fill="#9aa3ad"/>
      <circle cx="49" cy="108" r="9" fill="#e9b88c"/><circle cx="151" cy="108" r="9" fill="#e9b88c"/>
      <polygon points="100,18 158,40 100,62 42,40" fill="#23313f"/>
      <rect x="84" y="46" width="32" height="14" fill="#23313f"/>
      <path d="M150 42 v26" stroke="#f59e0b" stroke-width="3"/><circle cx="150" cy="70" r="5" fill="#f59e0b"/>
      <!-- occhi: sclera, iride e pupilla si muovono seguendo il puntatore (js/eyes.js) -->
      <g class="eyes">
        <ellipse cx="80" cy="103" rx="9" ry="7.6" fill="#fdfcf8" stroke="#d9a77c" stroke-width=".8"/>
        <ellipse cx="120" cy="103" rx="9" ry="7.6" fill="#fdfcf8" stroke="#d9a77c" stroke-width=".8"/>
        <g clip-path="url(#pd-eye-clip-l)"><g class="eye-ball eye-l">
          <circle cx="80" cy="103" r="4.9" fill="#6b4423"/><circle cx="80" cy="103" r="4.9" fill="none" stroke="#3d2412" stroke-width=".9"/>
          <circle class="pupil" cx="80" cy="103" r="2.3" fill="#141414"/>
          <circle class="glint" cx="78.3" cy="101.2" r="1.25" fill="#fff"/></g></g>
        <g clip-path="url(#pd-eye-clip-r)"><g class="eye-ball eye-r">
          <circle cx="120" cy="103" r="4.9" fill="#6b4423"/><circle cx="120" cy="103" r="4.9" fill="none" stroke="#3d2412" stroke-width=".9"/>
          <circle class="pupil" cx="120" cy="103" r="2.3" fill="#141414"/>
          <circle class="glint" cx="118.3" cy="101.2" r="1.25" fill="#fff"/></g></g>
        <path d="M71 101 q9 -8.5 18 0" fill="none" stroke="#c98f62" stroke-width="1.3" stroke-linecap="round"/>
        <path d="M111 101 q9 -8.5 18 0" fill="none" stroke="#c98f62" stroke-width="1.3" stroke-linecap="round"/>
        <ellipse class="lid" cx="80" cy="102.6" rx="10" ry="8.4" fill="#f2c9a0"/><ellipse class="lid" cx="120" cy="102.6" rx="10" ry="8.4" fill="#f2c9a0"/>
      </g>
      <g class="brows" fill="none" stroke="#8a939c" stroke-width="3.6" stroke-linecap="round"><path d="M68 82 q11 -6 23 -1"/><path d="M109 81 q12 -5 23 1"/></g>
      <g fill="none" stroke="#23313f" stroke-width="3.5"><circle cx="80" cy="102" r="15"/><circle cx="120" cy="102" r="15"/><path d="M95 102 h10"/></g>
      <g fill="none" stroke="#ffffff" stroke-opacity=".55" stroke-width="1.6" stroke-linecap="round"><path d="M70 94 q3 -4 8 -5"/><path d="M110 94 q3 -4 8 -5"/></g>

  </defs>
</svg>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <svg aria-hidden="true"><use href="#prof-svg"/></svg>
      <div><b>Professore Digitale</b><small>Cattedra Digitale Portatile</small></div>
    </div>
    <div class="chips" id="chips" aria-live="polite"></div>
    <button class="net attesa" id="net" type="button" title="Controllo della connessione…"><span class="dot" aria-hidden="true"></span><span class="lbl">Online…</span></button>
    <div class="tools">
      <button class="icon-btn stop" id="btn-stop" hidden title="Ferma la voce">■ Stop voce</button>
      <button class="icon-btn" id="btn-print" title="Stampa la schermata o l'argomento" aria-label="Stampa" aria-haspopup="menu">🖨️</button>
      <button class="icon-btn" id="btn-font-down" title="Testo più piccolo" aria-label="Testo più piccolo">A−</button>
      <button class="icon-btn" id="btn-font-up" title="Testo più grande" aria-label="Testo più grande">A+</button>
      <button class="icon-btn" id="btn-theme" title="Cambia colori (chiaro, scuro, alto contrasto)" aria-label="Cambia colori">◐</button>
      <button class="icon-btn" id="btn-projector" title="Modalità proiettore" aria-label="Modalità proiettore">⛶</button>
    </div>
  </header>

  <nav class="sidebar" aria-label="Sezioni">
    <button class="nav-btn" data-view="home"><span class="ico">🏠</span><span>Inizio</span></button>
    <button class="nav-btn" data-view="lessons"><span class="ico">📚</span><span>Lezioni</span></button>
    <button class="nav-btn" data-view="ask"><span class="ico">💬</span><span>Chiedi al Professore</span></button>
    <button class="nav-btn" data-view="board"><span class="ico">🖊️</span><span>Lavagna</span></button>
    <button class="nav-btn" data-view="practice"><span class="ico">🎯</span><span>Palestra</span></button>
    <button class="nav-btn" data-view="vita"><span class="ico">🏛️</span><span>Vita digitale</span></button>
    <button class="nav-btn" data-view="truffa"><span class="ico">🕵️</span><span>È una truffa?</span></button>
    <button class="nav-btn" data-view="quiz"><span class="ico">🎓</span><span>Quiz e attestati</span></button>
    <button class="nav-btn" data-view="competenze"><span class="ico">🧭</span><span>Le mie competenze</span></button>
    <button class="nav-btn" data-view="cultura"><span class="ico">🌍</span><span>Cultura generale</span></button>
    <button class="nav-btn" data-view="libro"><span class="ico">📖</span><span>Tecnologia Gentile</span></button>
    <button class="nav-btn" data-view="fenice"><span class="ico">🔥</span><span>FeniceOS</span></button>
    <button class="nav-btn" data-view="aula"><span class="ico">🏫</span><span>Aula</span></button>
    <button class="nav-btn" data-view="enti"><span class="ico">📋</span><span>Registro e incontri</span></button>
    <button class="nav-btn" data-view="setup" hidden><span class="ico">🧰</span><span>Configura IA e voce</span></button>
    <button class="nav-btn" data-view="settings"><span class="ico">⚙️</span><span>Impostazioni</span></button>
    <button class="nav-btn esci" id="btn-exit" type="button"><span class="ico">🚪</span><span>Esci</span></button>
    <div class="credit">Ideato e sviluppato da<br><b>Danilo D'Auria</b><br>Licenza MIT · v<span id="app-version"></span></div>
  </nav>

  <main id="main" tabindex="-1">
    <section class="view" id="view-home" hidden></section>
    <section class="view" id="view-lessons" hidden></section>
    <section class="view" id="view-ask" hidden></section>
    <section class="view" id="view-board" hidden></section>
    <section class="view" id="view-practice" hidden></section>
    <section class="view" id="view-quiz" hidden></section>
    <section class="view" id="view-attestato" hidden></section>
    <section class="view" id="view-cultura" hidden></section>
    <section class="view" id="view-libro" hidden></section>
    <section class="view" id="view-fenice" hidden></section>
    <section class="view" id="view-aula" hidden></section>
    <section class="view" id="view-sostieni" hidden></section>
    <section class="view" id="view-vita" hidden></section>
    <section class="view" id="view-truffa" hidden></section>
    <section class="view" id="view-ripasso" hidden></section>
    <section class="view" id="view-competenze" hidden></section>
    <section class="view" id="view-enti" hidden></section>
    <section class="view" id="view-profili" hidden></section>
    <section class="view" id="view-setup" hidden></section>
    <section class="view" id="view-settings" hidden></section>
  </main>
</div>
